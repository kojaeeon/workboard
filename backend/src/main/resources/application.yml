server:
  address: ${DASHBOARD_HOST:127.0.0.1}
  port: ${DASHBOARD_PORT:8080}
spring:
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
dashboard:
  db-path: ${DASHBOARD_DB_PATH:data/dashboard.db}
  examples-path: ${DASHBOARD_EXAMPLES_PATH:examples}
