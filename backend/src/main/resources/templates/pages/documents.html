<section class="page" th:fragment="content">
    <h1 class="page-title">Markdown Workspace</h1>
    <p class="muted page-subtitle">문서와 다이어그램을 한 곳에서 관리하세요.</p>
    <div class="documents-layout">
      <q-card v-show="library" class="library column column-gap"
        ><div class="text-h6">문서</div>
        <div v-if="documents.length">
          <q-btn
            v-for="item in documents"
            :key="item.id"
            flat
            no-caps
            class="full-width"
            align="left"
            :label="item.title"
            @click="openStored(item.id)"
          ></q-btn>
        </div>
        <q-separator ></q-separator>
        <div class="text-h6">로컬 폴더</div>
        <q-input v-model="folderPath" label="폴더 경로" placeholder="C:\문서\Markdown" ></q-input>
        <div class="row items-center">
          <q-btn
            label="폴더 등록"
            color="primary"
            icon="create_new_folder"
            @click="register"
          ></q-btn><q-btn
            icon="refresh"
            flat
            round
            aria-label="폴더 목록 새로고침"
            @click="act(refreshLibrary)"
          ></q-btn>
        </div>
        <div v-if="!folders.length" class="muted text-caption">
          읽을 폴더 경로를 등록하세요. 등록 폴더 바로 아래의 MD 파일만 조회합니다.
        </div>
        <q-expansion-item
          v-for="folder in folders"
          :key="folder.id"
          :label="basename(folder.path)"
          icon="folder"
          class="full-width"
          ><div style="overflow-wrap: anywhere" class="text-caption">{{ folder.path }}</div>
          <q-btn flat dense label="등록 해제" icon="link_off" @click="unregister(folder.id)" ></q-btn>
          <div v-if="folder.error" class="text-warning text-caption">
            폴더를 읽을 수 없습니다: {{ folder.error }}
          </div>
          <div class="muted text-caption">MD {{ folder.files.length }}개</div>
          <q-btn
            v-for="path in folder.files"
            :key="path"
            flat
            no-caps
            icon="description"
            :label="basename(path)"
            align="left"
            class="full-width"
            @click="openLocal(path)"
        ></q-btn></q-expansion-item>
        <q-uploader
          url="/api/documents/upload"
          field-name="file"
          label="MD 불러오기"
          auto-upload
          accept=".md,.markdown,text/markdown"
          :max-file-size="2097152"
          style="width: 100%; height: 115px"
          @added="trackUpload"
          @uploaded="uploaded"
          @rejected="error(new Error('2MB 이하 파일을 선택하세요.'))"
          @failed="error(new Error('UTF-8 형식의 MD 파일이 필요합니다.'))"
        ></q-uploader>
      </q-card>
      <div class="column column-gap grow min-w-0">
        <div class="row items-center row-gap">
          <q-input v-model="document.title" label="문서 제목" class="grow" ></q-input><q-btn
            color="primary"
            icon="save"
            round
            aria-label="저장"
            :loading="busy"
            @click="save"
          ><q-tooltip>저장</q-tooltip></q-btn><q-btn
            outline
            color="primary"
            icon="picture_as_pdf"
            round
            aria-label="PDF 출력"
            :loading="pdfBusy"
            :disable="!document.content.trim()"
            @click="exportPdf"
          ><q-tooltip>PDF 출력</q-tooltip></q-btn><q-btn flat round icon="delete" color="negative" aria-label="문서 삭제"
            :disable="document.id === null || busy" @click="remove" ><q-tooltip>문서 삭제</q-tooltip></q-btn>
        </div>
        <div class="text-caption muted" style="overflow-wrap: anywhere">{{ location }}</div>
        <div class="row items-center" style="gap: 8px">
          <q-btn
            flat
            round
            :icon="library ? 'menu_open' : 'menu'"
            :aria-label="library ? '왼쪽 목록 접기' : '왼쪽 목록 펼치기'"
            :aria-expanded="library"
            @click="library = !library"
          ></q-btn><q-btn
            color="primary"
            round
            icon="code"
            aria-label="텍스트 모드"
            :flat="mode !== 'text'"
            :unelevated="mode === 'text'"
            @click="setMode('text')"
          ></q-btn><q-btn
            color="primary"
            round
            icon="visibility"
            aria-label="렌더 모드"
            :flat="mode !== 'render'"
            :unelevated="mode === 'render'"
            @click="setMode('render')"
          ></q-btn><q-btn
            flat
            round
            icon="format_list_bulleted"
            aria-label="문서 목차 열기"
            @click="indexOpen = true"
          ></q-btn><q-space ></q-space><q-btn
            flat
            round
            icon="refresh"
            aria-label="미리보기 새로고침"
            @click="preview = document.content"
          ></q-btn>
        </div>
        <q-card v-show="mode === 'text'" class="full-width min-w-0"
          ><div class="text-caption muted q-mb-md">
            Ctrl+F 찾기 · F3 다음 · Shift+F3 이전 · Esc 닫기
          </div>
          <markdown-editor ref="editor" v-model="document.content" :dark="dark"
        ></markdown-editor></q-card>
        <q-card v-show="mode === 'render'" class="full-width min-w-0" style="overflow: auto"
          ><div ref="previewRoot"><markdown-preview :content="preview" :theme="theme" ></markdown-preview></div
        ></q-card>
      </div>
    </div>
    <div class="document-jump-widget column" role="navigation" aria-label="문서 처음과 끝으로 이동">
      <q-btn
        flat
        round
        icon="vertical_align_top"
        aria-label="문서 맨 위로 이동"
        @click="jumpEnd()"
      ></q-btn><q-separator ></q-separator><q-btn
        flat
        round
        icon="vertical_align_bottom"
        aria-label="문서 맨 아래로 이동"
        @click="jumpEnd(true)"
      ></q-btn>
    </div>
    <q-dialog v-model="indexOpen"
      ><q-card style="width: 576px; max-width: 100%"
        ><div class="row justify-between items-center">
          <div class="text-h6">문서 목차 · Index</div>
          <q-btn flat round icon="close" aria-label="목차 닫기" @click="indexOpen = false" ></q-btn>
        </div>
        <div class="column" style="max-height: 65vh; overflow: auto; gap: 4px">
          <div v-if="!entries.length">문서에 제목이 없습니다.</div>
          <q-btn
            v-for="(entry, i) in entries"
            :key="i"
            flat
            no-caps
            align="left"
            :label="`H${entry.level} · ${entry.label}`"
            :class="`toc-entry toc-level-${entry.level}`"
            :style="{ paddingLeft: `${12 + (entry.level - 1) * 16}px` }"
            @click="jump(i, entry.line)"
          ></q-btn></div></q-card
    ></q-dialog>
  </section>
