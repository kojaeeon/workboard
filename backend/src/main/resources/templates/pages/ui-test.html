<section class="page" th:fragment="content">
    <h1 class="page-title">UI_TEST</h1>
    <p class="muted page-subtitle">프론트메터로 정의하는 UI 테스트</p>
    <div class="ui-test-layout">
      <q-card class="column column-gap ui-test-source"
        ><div class="text-h6">시나리오 문서</div>
        <div class="row full-width items-center row-gap">
          <q-select
            :model-value="selected"
            @update:model-value="load"
            :options="scenarioSources.map((s) => ({ label: s.label, value: s.key }))"
            label="등록 폴더의 MD"
            emit-value
            map-options
            class="grow min-w-0"
            :disable="disabled"
          ></q-select><q-btn
            flat
            round
            icon="refresh"
            aria-label="시나리오 파일 목록 갱신"
            :loading="refreshing"
            :disable="disabled"
            @click="refresh"
          ></q-btn>
        </div>
        <label class="scenario-upload"
          ><span>시나리오 MD 불러오기</span><q-icon name="add_box" size="24px" ></q-icon><input
            type="file"
            aria-label="시나리오 MD 불러오기"
            accept=".md,.markdown"
            :disabled="disabled"
            @change="upload($event)" /></label
        ><markdown-editor
          v-model="source"
          :dark="dark"
          height="480px"
          :disabled="disabled"
          aria-label="시나리오 편집기" ></markdown-editor><q-btn
          flat
          label="단계 확인"
          icon="checklist"
          :disable="disabled"
          @click="validate()"
      ></q-btn></q-card>
      <div class="column column-gap ui-test-results">
        <q-card class="column column-gap full-width"
          ><div class="text-h6">브라우저 MD 설정</div>
          <div class="row full-width items-center" style="gap: 8px">
            <q-select
              :model-value="browserSelected"
              @update:model-value="loadBrowser"
              :options="sources.map((s) => ({ label: s.label, value: s.key }))"
              label="브라우저 설정 MD"
              clearable
              emit-value
              map-options
              class="grow min-w-0"
              :disable="disabled"
            ></q-select><q-btn
              flat
              round
              icon="refresh"
              aria-label="브라우저 MD 목록 새로고침"
              :disable="disabled"
              @click="refresh"
            ></q-btn>
          </div>
          <label class="scenario-upload"
            ><span>브라우저 MD 불러오기</span><q-icon name="add_box" size="24px" ></q-icon><input
              type="file"
              aria-label="브라우저 MD 불러오기"
              accept=".md,.markdown"
              :disabled="disabled"
              @change="upload($event, true)"
          /></label>
          <div class="text-body2" style="white-space: pre-wrap; overflow-wrap: anywhere">
            {{ browserMessage }}
          </div>
          <q-expansion-item class="full-width" label="적용할 브라우저 설정" icon="settings"
            ><code-block
              :content="JSON.stringify(browserPreview, null, 2) || ''"
              language="json" ></code-block></q-expansion-item
        ></q-card>
        <q-card class="column column-gap full-width"
          ><div class="text-h6">{{ title }}</div>
          <q-input
            v-model="baseUrl"
            class="full-width"
            label="시작 URL"
            :disable="disabled"
          ></q-input><q-toggle v-model="headed" label="브라우저 표시" :disable="disabled" ></q-toggle>
          <div class="row items-center row-gap">
            <q-btn
              color="primary"
              label="테스트 실행"
              icon="play_arrow"
              :loading="starting"
              :disable="running || browserError"
              @click="start"
            ></q-btn><q-btn
              flat
              color="negative"
              label="중지"
              icon="stop"
              :disable="!running || stopping"
              @click="stop"
            ></q-btn>
          </div>
          <div
            class="text-body2"
            style="white-space: pre-wrap; overflow-wrap: anywhere"
            role="status"
          >
            {{ message }}
          </div>
          <div class="text-caption muted" style="overflow-wrap: anywhere">{{ output }}</div></q-card
        >
        <q-table
          class="full-width"
          :columns="columns"
          :rows="rows"
          row-key="number"
          :pagination="{ rowsPerPage: 15 }"
          wrap-cells
        ></q-table>
        <div v-if="files.length" class="column column-gap full-width">
          <div class="text-h6">실행 결과</div>
          <div class="row" style="gap: 8px">
            <q-btn
              v-for="file in files"
              :key="file"
              flat
              dense
              no-caps
              :label="file"
              icon="download"
              :href="artifact(file)"
            ></q-btn>
          </div>
          <img
            v-if="image"
            :src="artifact(image, true)"
            alt="UI 테스트 실행 화면"
            class="full-width"
            style="border-radius: 8px"
          />
        </div>
      </div>
    </div>
  </section>
